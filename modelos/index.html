<html>
    <head>
        <title>Releituras em modelos 3D</title>
        <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
      <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
      <!-- <script src="gesture-detector.js"></script>
      <script src="gesture-handler.js"></script> -->
    </head>

    <body style="margin: 0px; overflow: hidden;">

      <a-scene vr-mode-ui = "enabled: false;" embedded arjs = "debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;" gesture-detector >

        <a-assets>
           <a-asset-item id="modelo-pedrinhas" src="https://savilaufc.s3.us-east-1.amazonaws.com/pedrinhas.glb"></a-asset-item>
           <a-asset-item id="modelo-farmacia" src="https://savilaufc.s3.us-east-1.amazonaws.com/farmacia.glb"></a-asset-item>
           <a-asset-item id="modelo-rapariga" src="https://savilaufc.s3.us-east-1.amazonaws.com/a+rapariga.glb"></a-asset-item>
           <a-asset-item id="modelo-anjo" src="https://savilaufc.s3.us-east-1.amazonaws.com/anjo.glb"></a-asset-item>
           <a-asset-item id="modelo-sertanejo" src="https://savilaufc.s3.us-east-1.amazonaws.com/sertanejo.glb"></a-asset-item>

        </a-assets>

        <a-marker type="pattern"
                  url="https://savilaufc.s3.us-east-1.amazonaws.com/marcadores/pattern-pedrinhas-preto.patt"
                  raycaster="objects: .clickable"
                  emitevents="true"
                  cursor="fuse: false; rayOrigin: mouse;">
          <a-entity id = "pedrinhas"
                    rotation = "-70 0 0"
                    position = "0.1 0.1 0.1"
                    scale="0.5 0.5 0.5"
                    gltf-model="#modelo-pedrinhas"
                    class="clickable"
                    gesture-handler
            ></a-entity>
        </a-marker>

        <a-marker type="pattern"
                  url="https://savilaufc.s3.us-east-1.amazonaws.com/marcadores/pattern-farmaciaSJ2.patt">
          <a-entity id = "farmacia"
                    rotation = "-70 0 0"
                    position = "0.1 0.1 0.1"
                    scale="0.5 0.5 0.5"
                    gltf-model="#modelo-farmacia"
                    gesture-handler
            ></a-entity>
        </a-marker>

        <a-marker type="pattern"
                  url="https://savilaufc.s3.us-east-1.amazonaws.com/marcadores/pattern-a+rapariga+-+preto.patt">
          <a-entity id = "rapariga"
                    rotation = "-70 0 0"
                    position = "0.1 0.1 0.1"
                    scale="0.2 0.2 0.2"
                    gltf-model="#modelo-rapariga"
                    gesture-handler
            ></a-entity>
        </a-marker>

        <a-marker type="pattern"
                  url="https://savilaufc.s3.us-east-1.amazonaws.com/marcadores/pattern-anjo-preto.patt">
          <a-entity id = "anjo"
                    rotation = "-70 0 0"
                    position = "0.1 0.1 0.1"
                    scale="0.05 0.05 0.05"
                    gltf-model="#modelo-anjo"
                    gesture-handler
            ></a-entity>
        </a-marker>

        <a-marker type="pattern"
                  url="https://savilaufc.s3.us-east-1.amazonaws.com/marcadores/pattern-sertanejo-preto.patt">
          <a-entity id = "sertanejo"
                    rotation = "-70 0 0"
                    position = "0.1 0.1 0.1"
                    scale="0.8 0.8 0.8"
                    gltf-model="#modelo-sertanejo"
                    gesture-handler
            ></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
      </a-scene>
    </body>

  <script>
    const sceneEl = document.querySelector("a-scene");

    sceneEl.addEventListener("markerFound", (e) => {
      isMarkerVisible = true;
    });

    sceneEl.addEventListener("markerLost", (e) => {
      isMarkerVisible = false;
    });
  </script>

</html>
