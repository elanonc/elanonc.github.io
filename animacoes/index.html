<html>
  <head>
    <title>Releituras com animações</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden">
    <a-scene
      vr-mode-ui="enabled: false;"
      embedded
      arjs="debugUIEnabled: false;"
    >
      <a-assets>
        <video
          id="video-betty"
          src="assets/videos/betty.mkv"
          playsinline
          webkit-playsinline
          muted
        ></video>
        <video
          id="video-alma-nordestina"
          src="assets/videos/alma nordestina.mp4"
          playsinline
          webkit-playsinline
          muted
        ></video>
        <video
          id="video-janela"
          src="assets/videos/janela.mp4"
          playsinline
          webkit-playsinline
          muted
        ></video>
        <video
          id="video-cafe"
          src="assets/videos/cafe.mp4"
          playsinline
          webkit-playsinline
          muted
        ></video>
        <video
          id="video-evandro-chagas"
          src="assets/videos/Evandro chagas.mp4"
          playsinline
          webkit-playsinline
          muted
        ></video>
      </a-assets>

      <!-- Marcador BETTY -->
      <a-marker
        type="pattern"
        url="assets/marcadores/pattern-betty-black_betty.patt"
        data-video="video-betty"
      >
        <a-video
          width="2.5"
          height="1.5"
          rotation="-70 0 0"
          position="0 0 0"
          src="#video-betty"
        >
        </a-video>
      </a-marker>

      <!-- Marcador ALMA NORDESTINA -->
      <a-marker
        type="pattern"
        url="assets/marcadores/pattern-alma nordestina.patt"
        data-video="video-alma-nordestina"
      >
        <a-video
          width="2.5"
          height="1.5"
          rotation="-70 0 0"
          position="0 0 0"
          src="#video-alma-nordestina"
        >
        </a-video>
      </a-marker>

      <!-- Marcador JANELA -->
      <a-marker
        type="pattern"
        url="assets/marcadores/pattern-janela.patt"
        data-video="video-janela"
      >
        <a-video
          width="2.5"
          height="1.5"
          rotation="-70 0 0"
          position="0 0 0"
          src="#video-janela"
        >
        </a-video>
      </a-marker>

      <!-- Marcador CAFE -->
      <a-marker
        type="pattern"
        url="assets/marcadores/pattern-cafe.patt"
        data-video="video-cafe"
      >
        <a-video
          width="2.5"
          height="1.65"
          rotation="-70 0 0"
          position="0 0 0"
          src="#video-cafe"
        >
        </a-video>
      </a-marker>

      <a-marker
        type="pattern"
        url="assets/marcadores/pattern-evandro chagas.patt"
        data-video="video-evandro-chagas"
      >
        <a-video
          width="2.5"
          height="1.5"
          rotation="-70 0 0"
          position="0 0 0"
          src="#video-evandro-chagas"
        >
        </a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.onload = function () {
        const markers = document.querySelectorAll("a-marker");

        markers.forEach((marker) => {
          const videoId = marker.getAttribute("data-video");
          const video = document.querySelector(`#${videoId}`);

          if (!video) {
            console.warn(`Vídeo com ID '${videoId}' não encontrado.`);
            return;
          }

          // Quando o marcador é detectado
          marker.addEventListener("markerFound", () => {
            video
              .play()
              .catch((error) => console.log("Reprodução bloqueada:", error));
          });

          // Quando o marcador é perdido
          marker.addEventListener("markerLost", () => {
            video.pause();
          });

          // Garante que o vídeo possa ser iniciado após interação do usuário
          function enableVideoPlayback() {
            video
              .play()
              .catch(() => console.log("Reprodução bloqueada até interação."));
            document.body.removeEventListener("click", enableVideoPlayback);
          }

          document.body.addEventListener("click", enableVideoPlayback);
        });
      };
    </script>
  </body>
</html>
